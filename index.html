<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>notsodumb</title>
    <link rel="icon" type="image/png" href="favicon/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=Silkscreen:wght@400;700&display=swap"
    />
    <link rel="stylesheet" href="notsodumb.css" />
  </head>
  <body class="notsodumb-page">
    <main class="notsodumb-shell">
      <div class="notsodumb-lang-toggle" id="notsodumbLangToggle" aria-label="Switch language">
        <button type="button" class="notsodumb-lang-btn" data-lang="th">TH</button>
        <button type="button" class="notsodumb-lang-btn" data-lang="en">EN</button>
      </div>

      <section class="notsodumb-content" id="notsodumbContent" aria-label="Notsodumb content"></section>
    </main>

    <!-- Twemoji by X/Twitter contributors and the jdecked/twemoji project -->
    <script src="https://cdn.jsdelivr.net/npm/@twemoji/api@17.0.2/dist/twemoji.min.js" integrity="sha384-ffx6atwP+2a1uHhw+XT6uAGhdssJviyWfbhOgvzJqE1X+qUM1Aq3mS3WW70vSq6S" crossorigin="anonymous"></script>
    <script src="quiz.js"></script>
    <script src="notsodumb.js"></script>
  </body>
</html>
